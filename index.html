<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff7a1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>English Dashboard — Professor Particular</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    html,body{margin:0;min-height:100%;background:#0d0d0d}
    #app{min-height:100vh}
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    async function loadApp() {
      const response = await fetch('./page.html');
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      document.title = doc.title || document.title;
      doc.head.querySelectorAll('style,link[rel="stylesheet"]').forEach(node => {
        document.head.appendChild(node.cloneNode(true));
      });
      document.getElementById('app').outerHTML = doc.body.innerHTML;
    }

    loadApp().catch(() => {
      document.getElementById('app').innerHTML = '<p style="color:#fff;padding:2rem;font-family:sans-serif">Não foi possível carregar a interface.</p>';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
